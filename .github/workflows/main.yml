name: CI devops 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test with Maven
        run: mvn clean verify --file ./tp1-docker/backend/simple-api/pom.xml

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=arielYAPO_tp-devops-correction-docker
          -Dsonar.organization=arielyapo
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          --file ./tp1-docker/backend/simple-api/pom.xml
