---
- name: Create API directory on remote server
  ansible.builtin.file:
    path: /opt/tp-devops/simple-api
    state: directory
    mode: '0755'

- name: Copy Java API files to remote server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tp1-docker/backend/simple-api/"
    dest: /opt/tp-devops/simple-api/

- name: Build Java API Docker image
  community.docker.docker_image:
    name: tp-devops-simple-api
    tag: latest
    source: build
    build:
      path: /opt/tp-devops/simple-api
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python

- name: Start Java API container
  community.docker.docker_container:
    name: backend
    image: tp-devops-simple-api:latest
    state: started
    restart_policy: unless-stopped
    env:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/.db-password length=24 chars=ascii_letters,digits') }}"
    networks:
      - name: my-network
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
  no_log: true
